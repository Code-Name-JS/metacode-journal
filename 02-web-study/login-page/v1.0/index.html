<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>로그인·Code-Name-JS</title>

        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <!-- 카드 영역 -->
        <main class="card">

            <!-- 로고 -->
            <div class="logo">
                <h1>Opus 5.5</h1>
            </div>

            <!-- 이메일 -->
            <div class="field-input-wrap">
            <input type="email" placeholder="아이디를 입력해 주세요." /> 
            </div>

            <!-- 비밀번호 -->
            <div class="field-input-wrap">
            <input type="password" placeholder="비밀번호를 입력해 주세요." />
            </div>

            <!-- 로그인 하기 버튼 -->
            <div>
                <button type="submit">
                    <span class="btn-text">로그인 하기</span>
                </button>
            </div>

            <!-- 회원가입 하기 버튼 -->
            <div>
                <button type="submit">
                    <span class="btn-text">회원가입</span>
                </button>
            </div>
        </main>
    </body>
</html>
