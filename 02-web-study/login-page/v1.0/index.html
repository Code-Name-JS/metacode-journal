<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>로그인·Code-Name-JS</title>

        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        
        <!-- 카드 영역 -->
        <main class="card">

            <!-- 로고 -->
            <div class="logo">
                <h1 class="logo-font">Opus 5.5</h1>
            </div>

            
            <form>

                <!-- 이메일 -->
                <div class="field">
                    <div class="input-wrap">
                        <input type="email" name="email" placeholder="아이디를 입력해 주세요." autocomplete="email" aria-describedby="emailError"> 
                    </div>
                    <p class="error-msg" id="emailError" role="alert"></p>
                </div>

                <!-- 비밀번호 -->
                <div class="field">
                    <div class="input-wrap">
                        <input type="password" name="password" placeholder="비밀번호를 입력해 주세요." autocomplete="current-password" aria-describedby="passwordError">
                    </div>
                    <p class="error-msg" id="passwordError" role="alert"></p>
                </div>

                <div class="socials">                
                    
                    <!-- 로그인 하기 버튼 -->
                    <button type="submit" class="btn-social">
                        <span class="btn-text">로그인 하기</span>
                    </button>
                </div>

                <div class="socials">
                    <!-- 회원가입 하기 버튼 -->    
                    <button type="button" class="btn-social">
                        <span class="btn-text">회원가입</span>
                    </button>
                </div>
            </form>
        </main>
    </body>
</html>
