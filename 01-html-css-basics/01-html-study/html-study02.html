<!-- HTML 정보가 HTML 5라는 최신 브라우저 모드라는 것을 알립니다. -->
<!-- HTML을 첫 줄에 선언하지 않으면 Quiks Mode라는 구버전 호환 모드로 실행될 수 있습니다. -->
<!DOCTYPE html>

<!-- HTML 문서의 최상위 태그로 언어 설정이 SEO와 접근성에 중요한 역할을 합니다. -->
<html lang = "ko">

<head>
    <meta charset = "UTF-8">

    <!-- 모바일 반응형 설정 -->
    <!-- width=device-width : 화면 너비 = 기기 너비 -->
    <!-- initial-scale = 1.0 : 확대 비율 100% -->
    <!-- 모바일에서 웹사이트가 정상적으로 보이도록 설정 -->
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    <title>My Website</title>

    <!-- 모바일에서 웹사이트 설명과 작성자를 설정 -->
    <meta name = "description" content = "웹사이트 설명">
    <meta name = "author" content = "작성자 이름">

    <!-- 확장자 css 파일을 연결하는 설정 -->
    <link rel = "stylesheet" href = "style02.css">
</head>

<body>

    <header>
        <h1>사이트 제목</h1>
    </header>

    <main>
        <p>메인 콘텐츠</p>
    </main>

    <footer>
        <P>2026 My Website</P>
    </footer>

    <!-- 확장자 js 파일을 연결하는 설정 -->
    <script src = "script02.js"></script>
</body>
</html>
