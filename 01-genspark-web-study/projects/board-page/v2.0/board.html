<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시판 · 커뮤니티 시안</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F6BF5'/%3E%3Cpath d='M16 7c-5 0-9 3.4-9 7.6 0 2.4 1.3 4.6 3.4 6v3.4l3.4-1.9c.7.1 1.4.2 2.2.2 5 0 9-3.4 9-7.7S21 7 16 7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   DESIGN TOKENS (CSS Variables) — 색만 바꿔도 브랜드 교체 가능
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4F6BF5;
  --primary-strong:#3A54D6;
  --primary-weak:#EDF1FE;
  --on-primary:#FFFFFF;
  --bg:#F4F6FB;
  --surface:#FFFFFF;
  --surface-2:#F8FAFD;
  --text:#1B1F2B;
  --muted:#687086;
  --border:#E4E8F2;
  --border-strong:#D3D9E6;
  --notice-bg:#F0F4FF;
  --danger:#E5484D;
  --radius:14px;
  --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(20,25,45,.05),0 2px 10px rgba(20,25,45,.05);
  --shadow-lg:0 16px 48px rgba(20,25,45,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --chip-q-bg:#FFF4E0; --chip-q-tx:#B25E00;
  --chip-f-bg:#E0F5EF; --chip-f-tx:#0B7A5C;
  --chip-r-bg:#FDE7EF; --chip-r-tx:#C2255C;
}
[data-theme="dark"]{
  --primary:#7C93FF;
  --primary-strong:#9FB0FF;
  --primary-weak:#232A45;
  --on-primary:#0E1017;
  --bg:#0E1017;
  --surface:#171A24;
  --surface-2:#1D2130;
  --text:#EAECF4;
  --muted:#9AA1B5;
  --border:#272C3D;
  --border-strong:#363D55;
  --notice-bg:#1A2138;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --chip-q-bg:#3A2E14; --chip-q-tx:#F5B85E;
  --chip-f-bg:#0F2B24; --chip-f-tx:#5FD0A8;
  --chip-r-bg:#341C26; --chip-r-tx:#F47BA6;
}
html{scroll-behavior:smooth;scroll-padding-top:78px}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

[hidden]{display:none !important}
/* ---------- 헤더 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-strong));display:grid;place-items:center;color:#fff;flex:none}
.brand-text{font-size:18px;font-weight:800;letter-spacing:-.3px}
.brand-text em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);display:block;margin-top:-2px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;
  transition:transform .12s ease,box-shadow .12s ease,background .15s ease,color .15s ease,border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 35%,transparent)}
.btn-primary:hover{background:var(--primary-strong);color:var(--on-primary)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2)}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--muted);border:1px solid var(--border);background:var(--surface);
  transition:color .15s ease,border-color .15s ease;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px}
[data-theme="dark"] .icon-sun{display:block}
[data-theme="dark"] .icon-moon{display:none}
.icon-sun{display:none}
.icon-moon{display:block}

/* ---------- 레이아웃 ---------- */
.container{max-width:980px;margin:0 auto;padding:26px 20px 80px}
.view[hidden]{display:none}

/* ---------- 목록 헤더 + 탭 + 검색 ---------- */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.board-title{font-size:24px;font-weight:800;letter-spacing:-.5px}
.board-title .total{font-size:14px;font-weight:600;color:var(--muted);margin-left:8px}
.board-title .total b{color:var(--primary);font-weight:800}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
  transition:all .15s ease;
}
.tab:hover{color:var(--primary);border-color:var(--primary)}
.tab.is-active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 30%,transparent)}
.search{display:flex;gap:0;flex:none}
.search input{
  width:230px;padding:9px 14px;border:1px solid var(--border);border-right:none;
  border-radius:10px 0 0 10px;background:var(--surface);outline:none;transition:border-color .15s ease;
}
.search input:focus{border-color:var(--primary)}
.search input::placeholder{color:var(--muted)}
.search .btn{border-radius:0 10px 10px 0;padding:9px 18px}

/* ---------- 테이블 ---------- */
.table-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.board-table{width:100%;border-collapse:collapse;font-size:14px}
.board-table th{
  text-align:left;padding:13px 16px;font-size:12.5px;font-weight:700;color:var(--muted);
  background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;
}
.board-table td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.board-table tbody tr{transition:background .12s ease;scroll-margin-top:78px}
.board-table tbody tr:last-child td{border-bottom:none}
.board-table tbody tr:hover{background:var(--surface-2)}
.board-table tbody tr.is-notice{background:var(--notice-bg)}
.board-table tbody tr.is-notice:hover{background:color-mix(in srgb,var(--notice-bg) 60%,var(--surface-2))}
.td-no{width:64px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge-notice{
  display:inline-block;font-size:11px;font-weight:800;color:var(--primary);
  background:color-mix(in srgb,var(--primary) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);
  padding:2px 8px;border-radius:999px;letter-spacing:.3px;
}
.td-title{max-width:0;width:auto}
.title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title-link{font-weight:600;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.title-link:hover{color:var(--primary)}
.c-count{font-size:12.5px;color:var(--primary);font-weight:700}
.clip{flex:none;display:inline-flex;color:var(--muted)}
.clip svg{width:14px;height:14px}
.td-author{white-space:nowrap}
.author-cell{display:inline-flex;align-items:center;gap:7px;color:var(--text)}
.avatar{
  width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;
  color:#fff;font-size:11px;font-weight:700;flex:none;
}
.td-date,.td-views{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.td-views{width:70px}
.chip{
  flex:none;display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;
  padding:2.5px 9px;border-radius:999px;letter-spacing:.2px;
}
.chip-공지{background:var(--primary);color:var(--on-primary)}
.chip-일반{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.chip-질문{background:var(--chip-q-bg);color:var(--chip-q-tx)}
.chip-자료실{background:var(--chip-f-bg);color:var(--chip-f-tx)}
.chip-후기{background:var(--chip-r-bg);color:var(--chip-r-tx)}

/* ---------- 검색 하이라이트 · 모바일 공지 배지 ---------- */
mark{background:color-mix(in srgb,var(--primary) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.title-wrap .title-badge{display:none}

/* ---------- 빈 상태 ---------- */
.empty{padding:56px 16px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:12px}
.empty p{font-weight:600}
.empty .empty-sub{font-size:13px;margin-top:4px;font-weight:400}

/* ---------- 페이지네이션 ---------- */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:24px;flex-wrap:wrap}
.page-btn{
  min-width:36px;height:36px;padding:0 8px;border-radius:10px;font-size:14px;font-weight:600;
  color:var(--muted);border:1px solid var(--border);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s ease;
}
.page-btn:hover:not(:disabled):not(.is-active){color:var(--primary);border-color:var(--primary)}
.page-btn.is-active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 30%,transparent)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-btn svg{width:16px;height:16px}

/* ---------- 상세 ---------- */
.detail-card,.comment-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:30px 32px;
}
.detail-head{margin-top:14px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.detail-head h2{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.45;margin-top:10px;word-break:break-word}
.detail-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13.5px}
.detail-meta .avatar{width:26px;height:26px;font-size:12px}
.detail-meta .dot{opacity:.45}
.detail-attach{
  margin-top:20px;border:1.5px dashed var(--border-strong);border-radius:12px;padding:14px 18px;background:var(--surface-2);
}
.attach-title{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.attach-title svg{width:14px;height:14px}
.file-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.file-row .f-icon{color:var(--primary);flex:none;display:inline-flex}
.file-row .f-icon svg{width:16px;height:16px}
.file-row .f-name{font-weight:600;word-break:break-all}
.file-row .f-size{color:var(--muted);font-size:12.5px;margin-left:auto;flex:none}

.detail-content{padding:26px 0 10px;font-size:15px;line-height:1.85;color:var(--text);word-break:break-word}
.detail-content p{margin-bottom:16px}
.detail-content p:last-child{margin-bottom:0}
.detail-nav{margin-top:26px;border-top:1px solid var(--border)}

.nav-link{display:flex;align-items:center;gap:10px;padding:13px 2px;font-size:14px;border-bottom:1px solid var(--border)}
.nav-link:last-child{border-bottom:none}
.nav-link .dir{flex:none;font-size:12px;font-weight:800;color:var(--primary);width:56px}
.nav-link .dir.off{color:var(--muted)}
.nav-link .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nav-link:hover .t{color:var(--primary)}
.nav-link.is-empty{color:var(--muted);cursor:default}
.nav-link.is-empty .t{color:var(--muted);opacity:.6}

/* ---------- 댓글 ---------- */
.comment-box{margin-top:18px}
.comment-title{font-size:16px;font-weight:800;margin-bottom:16px}
.comment-title b{color:var(--primary)}
.comment-list{list-style:none}
.comment-item{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--border)}
.comment-item:first-child{border-top:none}
.comment-item .avatar{width:30px;height:30px;font-size:12px;flex:none;margin-top:2px}
.comment-body{flex:1;min-width:0}
.comment-meta{display:flex;align-items:center;gap:8px;font-size:12.5px}
.comment-meta .name{font-weight:700;font-size:13.5px}
.comment-meta .date{color:var(--muted)}
.comment-del{margin-left:auto;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px}
.comment-del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.comment-text{font-size:14px;margin-top:5px;word-break:break-word;line-height:1.7}
.comment-form{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.comment-form input{
  flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);outline:none;
  transition:border-color .15s ease;
}
.comment-form input:focus{border-color:var(--primary)}

/* ---------- 글쓰기 모달 ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(15,18,28,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .18s ease;
}
[data-theme="dark"] .modal-overlay{background:rgba(0,0,0,.6)}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-lg);width:min(580px,100%);max-height:88vh;overflow-y:auto;
  animation:popIn .2s ease;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.modal-head h3{font-size:18px;font-weight:800}
.modal .icon-btn{width:32px;height:32px}
.modal form{padding:16px 24px 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface-2);outline:none;transition:border-color .15s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:150px;line-height:1.7}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}
.attach-hint{
  display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
  border:1.5px dashed var(--border-strong);border-radius:10px;padding:12px 14px;margin-bottom:6px;background:var(--surface-2);
}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ---------- 토스트 ---------- */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(16px);
  background:var(--text);color:var(--bg);padding:12px 22px;border-radius:12px;
  font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;opacity:0;
  transition:opacity .25s ease,transform .25s ease;pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme="dark"] .toast{background:#EAECF4;color:#10131C}

/* ---------- 푸터 ---------- */
.footer{border-top:1px solid var(--border);padding:22px 0 40px;margin-top:10px}
.footer-inner{max-width:980px;margin:0 auto;padding:0 20px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- 반응형: 모바일은 테이블 → 카드 ---------- */
@media (max-width:767px){
  .topbar-inner{padding:12px 16px}
  .brand-text{font-size:16px}
  .container{padding:18px 14px 70px}
  .board-title{font-size:20px}
  .toolbar{gap:10px}
  .search{width:100%}
  .search input{flex:1;width:auto}
  .table-wrap{border:none;background:transparent;box-shadow:none}
  .board-table thead{display:none}
  .board-table,.board-table tbody{display:block}
  .board-table tbody tr{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:12px;
  }
  .board-table tbody tr:hover{background:var(--surface)}
  .board-table tbody tr.is-notice{background:var(--notice-bg)}
  .board-table tbody tr.is-notice:hover{background:var(--notice-bg)}
  .board-table td{border:none;padding:0;display:block}
  .td-no{display:none}
  .title-wrap .title-badge{display:inline-flex}
  .td-title{flex:1 1 100%;margin-bottom:4px}
  .td-author,.td-date,.td-views{display:inline-flex;align-items:center;font-size:12.5px}
  .td-date::before,.td-views::before{content:"";margin-right:10px;color:var(--border-strong)}
  .title-link{flex:1 1 100%;min-width:0;white-space:normal;word-break:break-all}
  .detail-card,.comment-box{padding:22px 18px;border-radius:12px}
  .detail-head h2{font-size:19px}
  .file-row .f-size{display:none}
  .modal form{padding:14px 18px 18px}
  .field-row{flex-direction:column;gap:0}
  .pagination{gap:5px}
  .page-btn{min-width:34px;height:34px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" id="brandBtn" aria-label="게시판 첫 화면으로">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3c-4.4 0-8 2.9-8 6.6 0 2.1 1.2 4 3 5.2V18l3.1-1.7c.6.1 1.2.2 1.9.2 4.4 0 8-2.9 8-6.6S16.4 3 12 3z" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">게시판<em>COMMUNITY BOARD</em></span>
    </a>
    <div class="topbar-actions">
      <button class="btn btn-primary" id="writeBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        글쓰기
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="다크 모드로 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="container">

  <!-- ============ 목록 뷰 ============ -->
  <section id="listView" class="view" aria-label="게시글 목록">
    <div class="board-head">
      <h1 class="board-title">게시판<span class="total">총 <b id="totalCount">0</b>건</span></h1>
    </div>

    <div class="toolbar">

const $ = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (t) => `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`;
const daysAgo = (n) => { const t = new Date(); t.setDate(t.getDate()-n); return fmtDate(t); };
const nf = (n) => Number(n).toLocaleString('ko-KR');
const AVATAR_COLORS = ['#4F6BF5','#7C3AED','#E5484D','#12A594','#F59E0B','#D6409F','#0EA5E9','#65A30D'];
const avatarColor = (name) => AVATAR_COLORS[[...name].reduce((a,c)=>a+c.charCodeAt(0),0) % AVATAR_COLORS.length];
const avatarHTML = (name) => `<span class="avatar" style="background:${avatarColor(name)}">${esc(name.charAt(0))}</span>`;

const POSTS = [
  { id:1,  category:'공지', title:'[공지] 9월 커뮤니티 이용 안내 및 운영 규칙', author:'관리자', date:daysAgo(0), views:3421, content:'안녕하세요, 커뮤니티 관리자입니다.\n\n모든 이용자분들이 편안하게 이용하실 수 있도록 아래 이용 규칙을 안내드립니다.\n\n1) 타인을 존중하는 언어 사용\n2) 광고성 게시물 및 스팸 게시물 금지\n3) 타인의 개인정보 무단 수집 금지\n4) 욕설 · 비방 · 혐오 표현 금지\n\n위 규칙을 지켜 주시면 감사하겠습니다.', files:[{name:'운영규칙_2026.pdf', size:'245KB'},{name:'커뮤니티_가이드라인.pdf', size:'1.2MB'}], comments:[{author:'서연', text:'확인했습니다! 감사합니다', date:daysAgo(0)}] },
  { id:2,  category:'공지', title:'[공지] 게시판 리뉴얼 오픈 기념 이벤트 안내', author:'관리자', date:daysAgo(1), views:2810, content:'게시판이 새롭게 리뉴얼되었습니다. 🎉\n\n리뉴얼 오픈을 기념하여 댓글을 남겨주신 분들 중 추첨을 통해 소정의 선물을 드립니다.\n\n이벤트 기간: 9월 12일 ~ 9월 30일\n참여 방법: 아무 게시글에 댓글 작성', files:[{name:'이벤트_배너.png', size:'512KB'}], comments:[{author:'민서', text:'와 리뉴얼 축하드려요!', date:daysAgo(1)},{author:'지훈', text:'이벤트 참여합니다!', date:daysAgo(0)}] },
  { id:3,  category:'일반', title:'새로 가입했어요, 잘 부탁드립니다!', author:'민서', date:daysAgo(2), views:187, content:'안녕하세요! 오늘 가입한 새내기입니다.\n\n평소에 관심 있던 주제로 이야기 나눌 수 있는 곳을 찾다가 들어오게 됐어요. 잘 부탁드립니다!', comments:[{author:'소민', text:'반가워요! 환영합니다 🎉', date:daysAgo(2)},{author:'태윤', text:'어서오세요~', date:daysAgo(1)}] },
  { id:4,  category:'일반', title:'다들 주말에 뭐 하세요?', author:'지훈', date:daysAgo(3), views:312, content:'요즘 주말마다 특별한 계획 없이 흘러보내는 것 같아서요.\n\n다들 주말에 보통 어떻게 시간을 보내시는지 궁금합니다!', comments:[{author:'하은', text:'저는 홈트하고 카페 가는 게 루틴이에요', date:daysAgo(3)},{author:'도윤', text:'산책 + 독서로 보냅니다 ㅎㅎ', date:daysAgo(2)}] },
  { id:5,  category:'일반', title:'오늘 처음으로 홈트 시작했어요 💪', author:'하은', date:daysAgo(4), views:258, content:'드디어 결심하고 오늘부터 홈트를 시작했습니다.\n\n10분이면 끝난다고 해서 시작했는데 생각보다 힘드네요... 그래도 꾸준히 해보려고요!', comments:[{author:'유진', text:'화이팅입니다! 꾸준함이 답이에요', date:daysAgo(4)}] },
  { id:6,  category:'일반', title:'회사 근처 맛집 추천 받습니다', author:'준호', date:daysAgo(5), views:421, content:'이직 후 회사 근처 맛집을 아직 못 찾았어요.\n\n점심 먹을 곳 추천 부탁드립니다. 국물 위주면 더 좋아요!', comments:[{author:'도윤', text:'저도 추천 부탁드려요 🙏', date:daysAgo(5)},{author:'하은', text:'회사 앞 골목에 있는 국수집 강추합니다!', date:daysAgo(4)},{author:'서연', text:'건물 2층 칼국수집도 좋아요', date:daysAgo(3)}] },
  { id:7,  category:'일반', title:'요즘 날씨에 딱 맞는 카페 발견했어요', author:'서연', date:daysAgo(6), views:164, content:'걷다 보니 분위기 좋은 카페를 발견했어요.\n\n창밖으로 정원이 보이는 구조라서 커피 마시며 쉬기 좋더라고요. 위치가 궁금하신 분들은 댓글 주세요!', comments:[] },
  { id:8,  category:'일반', title:'퇴근 후 운동 루틴 공유해요', author:'도윤', date:daysAgo(7), views:236, content:'저는 퇴근 후 이렇게 운동합니다.\n\n1) 가벼운 스트레칭 10분 → 2) 유산소 30분 → 3) 근력 20분 → 4) 샤워\n\n다들 루틴 어떻게 되시는지 궁금해요!', comments:[{author:'건우', text:'유산소 30분이면 체력 좋으시네요!', date:daysAgo(6)}] },
  { id:9,  category:'일반', title:'이번 주말 등산 코스 추천 부탁드려요', author:'유진', date:daysAgo(8), views:198, content:'날씨가 선선해져서 주말에 등산을 가보려고 합니다.\n\n초보도 무난하게 다녀올 수 있는 코스 추천 부탁드려요!', comments:[{author:'시우', text:'북한산 백운대 코스가 경치 좋아요', date:daysAgo(7)},{author:'유진', text:'오 감사합니다! 참고할게요', date:daysAgo(7)}] },
  { id:10, category:'일반', title:'독서 모임 하실 분 계신가요?', author:'시우', date:daysAgo(9), views:145, content:'매주 한 권씩 책을 읽고 의견을 나누는 소모임을 만들고 싶습니다.\n\n관심 있으신 분은 댓글 남겨주세요! 장르는 가볍게 소설 위주로 시작할까 합니다.', comments:[{author:'나은', text:'저요! 참여하고 싶어요', date:daysAgo(9)},{author:'다은', text:'소설 좋아합니다!', date:daysAgo(8)}] },
  { id:11, category:'질문', title:'처음 시작하는 사람에게 추천하는 운동은?', author:'은우', date:daysAgo(10), views:532, content:'운동을 한 번도 제대로 해본 적이 없는데, 이번에 시작해보려고 합니다.\n\n가볍게 시작할 수 있는 운동이나 유튜브 채널 추천 부탁드려요!', comments:[{author:'현우', text:'걷기부터 시작하세요! 무리 없이 꾸준히가 중요해요', date:daysAgo(10)},{author:'예린', text:'홈트 채널 추천드려요. 초보자 프로그램 많아요', date:daysAgo(9)},{author:'지우', text:'수영도 좋아요. 전신운동 + 부상 위험 낮음', date:daysAgo(8)}] },
  { id:12, category:'질문', title:'블루투스 이어폰 추천 부탁드립니다', author:'하윤', date:daysAgo(11), views:467, content:'운동할 때 쓸 블루투스 이어폰을 찾고 있어요.\n\n우선순위는 1) 착용감 2) 배터리 3) 가성비입니다. 예산은 15만 원 안쪽으로 생각하고 있어요.', comments:[{author:'태윤', text:'요즘 나오는 제품들은 다 괜찮아요. 매장에서 착용해보고 고르세요', date:daysAgo(11)}] },
  { id:13, category:'질문', title:'집에서 만들기 쉬운 요리 있을까요?', author:'지안', date:daysAgo(12), views:289, content:'요리를 거의 안 해봤는데, 자취를 시작하면서 한두 개는 만들어 먹고 싶어요.\n\n정말 쉬운 요리 추천 부탁드립니다!', comments:[{author:'소민', text:'계란 볶음밥 + 아보카도 토스트 추천!', date:daysAgo(12)}] },
  { id:14, category:'질문', title:'재택근무할 때 집중 잘 되는 팁 알려주세요', author:'수아', date:daysAgo(13), views:355, content:'재택근무를 시작했는데 집중이 잘 안 돼서 고민입니다.\n\n다들 어떤 방식으로 업무 집중력을 유지하시나요?', comments:[{author:'시우', text:'폼포도로 25분/5분 루틴 써봐요. 효과 좋아요', date:daysAgo(13)},{author:'건우', text:'저는 집이 아닌 카페로 나가요. 환경 전환이 중요해요', date:daysAgo(12)}] },
  { id:15, category:'질문', title:'사진 보정은 어떤 앱 쓰시나요?', author:'건우', date:daysAgo(14), views:174, content:'최근에 사진 찍는 게 취미가 됐는데, 보정은 아직 어렵네요.\n\n초보에게 괜찮은 보정 앱이나 방법 추천 부탁드려요.', comments:[] },
  { id:16, category:'질문', title:'자취 시작하는데 필요한 물품이 뭘까요?', author:'다은', date:daysAgo(15), views:398, content:'다음 달부터 자취를 시작합니다!\n\n꼭 필요한 물품 리스트를 알고 싶어요. 선배님들의 조언 부탁드립니다 🙏', comments:[{author:'태윤', text:'전기포트 + 밥솥 + 후라이팬이면 일단 시작 가능해요', date:daysAgo(15)},{author:'나은', text:'구비서류(계약서, 신분증 사본) 챙기세요!', date:daysAgo(14)}] },
  { id:17, category:'자료실', title:'[자료실] 2026년 캘린더 템플릿 공유합니다', author:'윤서', date:daysAgo(16), views:621, content:'한 해 동안 쓸 수 있는 캘린더 템플릿을 만들었습니다.\n\n필요하신 분들은 자유롭게 다운로드해서 쓰세요!', files:[{name:'2026_캘린더_템플릿.xlsx', size:'45KB'},{name:'2026_캘린더_템플릿_사용법.pdf', size:'320KB'}], comments:[{author:'지안', text:'감사합니다! 잘 쓸게요', date:daysAgo(16)},{author:'민서', text:'와 정성이 대단하세요 👍', date:daysAgo(15)}] },
  { id:18, category:'자료실', title:'[자료실] 초보자용 홈트 프로그램 PDF', author:'지우', date:daysAgo(17), views:448, content:'제가 4주 동안 실제로 해본 홈트 프로그램을 정리해서 올립니다.\n\n주차별 운동 구성과 식단 팁이 포함되어 있어요.', files:[{name:'홈트_프로그램_4주차.pdf', size:'2.1MB'}], comments:[{author:'예린', text:'바로 다운받았어요! 감사해요', date:daysAgo(17)}] },
  { id:19, category:'자료실', title:'[자료실] 무료 폰트 모음 링크 정리', author:'태윤', date:daysAgo(18), views:533, content:'상업적 이용이 가능한 무료 폰트 위주로 정리했습니다.\n\n사용 전에 라이선스는 꼭 확인하세요!', comments:[] },
  { id:20, category:'자료실', title:'[자료실] 여행 일정 짤 때 유용한 템플릿', author:'소민', date:daysAgo(19), views:276, content:'여행 가기 전에 일정 정리할 때 쓰는 엑셀 템플릿입니다.\n\n시간대별로 끌어다 쓰기 쉽게 만들어뒀어요.', files:[{name:'여행_일정표.xlsx', size:'28KB'}], comments:[] },
  { id:21, category:'후기', title:'[후기] 새로 산 러닝화 2주 사용 후기', author:'현우', date:daysAgo(20), views:387, content:'한 달 고민하다가 드디어 러닝화를 질렀습니다.\n\n2주 정도 신어본 결과, 쿠션감은 만족스러운데 사이즈는 반 업 정도 크게 나온 것 같아요. 참고하세요!', comments:[{author:'은우', text:'사이즈 정보 감사합니다!', date:daysAgo(20)},{author:'서연', text:'색상 이쁘네요 👟', date:daysAgo(19)}] },
  { id:22, category:'후기', title:'[후기] 홈트 30일 차! 몸 변화 인증합니다', author:'예린', date:daysAgo(21), views:742, content:'30일 동안 쉬지 않고 홈트를 해봤습니다.\n\n체중 변화보다는 체형 변화가 더 크게 느껴져요. 허리 라인이 확실히 달라졌어요.\n\n꾸준함이 정말 중요하네요. 다들 화이팅!', comments:[{author:'지훈', text:'대단하세요!! 저도 자극받고 갑니다', date:daysAgo(21)},{author:'하은', text:'우와 30일 대단해요 💪', date:daysAgo(20)},{author:'유진', text:'저도 시작해볼게요!', date:daysAgo(19)}] },
  { id:23, category:'후기', title:'[후기] 에어프라이어로 만든 간식 성공했어요', author:'지후', date:daysAgo(22), views:211, content:'집에 굴러다니던 에어프라이어를 드디어 써봤습니다.\n\n감자튀김 + 군고구마 둘 다 성공했어요! 온도와 시간 조절만 잘하면 끝이네요.', comments:[{author:'지안', text:'레시피 공유 부탁드려요!', date:daysAgo(22)}] },
  { id:24, category:'후기', title:'[후기] 전자책 리더기 구매 후기', author:'나은', date:daysAgo(23), views:334, content:'고민 끝에 전자책 리더기를 구매했습니다.\n\n눈의 피로감이 확실히 덜하고, 집중도 잘 돼요. 단점은 화면 전환 속도가 조금 느리다는 점 정도? 전체적으로 만족합니다.', comments:[{author:'시우', text:'저도 사고 싶어지네요 ㅎㅎ', date:daysAgo(23)}] }
];

/* ============================================================
   상태
   ============================================================ */
const state = { category:'전체', keyword:'', page:1, pageSize:10, currentId:null, viewed:new Set() };
let filtered = [];

/* ============================================================
   필터 · 렌더링
   ============================================================ */
const CATS = ['전체','공지','질문','자료실','후기','일반'];

function applyFilter(){
  let list = [...POSTS];
  if (state.category !== '전체') list = list.filter(p => p.category === state.category);
  if (state.keyword){
    const kw = state.keyword.toLowerCase();
    list = list.filter(p => [p.title, p.author, p.content].some(v => v.toLowerCase().includes(kw)));
  }
  list.sort((a,b) => (b.category==='공지') - (a.category==='공지') || b.id - a.id);
  filtered = list;
}

function renderTabs(){
  $('#categoryTabs').innerHTML = CATS.map(c => {
    const n = c==='전체' ? POSTS.length : POSTS.filter(p=>p.category===c).length;
    return `<button type="button" class="tab ${state.category===c?'is-active':''}" data-cat="${c}">${c} <span style="opacity:.55;font-size:12px;font-weight:600">${n}</span></button>`;
  }).join('');
}

function hl(text){
  if(!state.keyword) return esc(text);
  const i = text.toLowerCase().indexOf(state.keyword.toLowerCase());
  if(i === -1) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+state.keyword.length)) + '</mark>' + esc(text.slice(i+state.keyword.length));
}

function renderList(){
  applyFilter();
  $('#totalCount').textContent = nf(filtered.length);
  const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
  if (state.page > totalPages){ state.page = totalPages; }
  const start = (state.page - 1) * state.pageSize;
  const pagePosts = filtered.slice(start, start + state.pageSize);
  const totalNonNotice = filtered.filter(x => x.category !== '공지').length;

  const rows = pagePosts.map((p, i) => {
    const isNotice = p.category === '공지';
    const nonNoticeBefore = pagePosts.slice(0, i).filter(x => x.category !== '공지').length;
    const no = nf(totalNonNotice - start - nonNoticeBefore);
    const titleBadge = isNotice ? '<span class="badge-notice title-badge">공지</span>' : '';
    const clip = (p.files && p.files.length) ? `<span class="clip" title="첨부파일 ${p.files.length}개"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-8.3 8.3a6 6 0 0 1-8.5-8.5l8.3-8.3a4 4 0 0 1 5.7 5.7l-8.3 8.3a2 2 0 0 1-2.8-2.8l7.8-7.8"/></svg></span>` : '';
    return `<tr class="${isNotice?'is-notice':''}" data-id="${p.id}">
      <td class="td-no">${isNotice ? '<span class="badge-notice">공지</span>' : no}</td>
      <td class="td-title"><div class="title-wrap">${titleBadge}<a class="title-link" href="#${p.id}" data-id="${p.id}">${hl(p.title)}</a>${p.comments.length ? `<span class="c-count">[${p.comments.length}]</span>` : ''}${clip}</div></td>
      <td class="td-author"><span class="author-cell">${avatarHTML(p.author)}${esc(p.author)}</span></td>
      <td class="td-date">${p.date}</td>
      <td class="td-views">${nf(p.views)}</td>
    </tr>`;
  });

  $('#postBody').innerHTML = rows.length ? rows.join('') : `<tr><td colspan="5"><div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
    <p>게시글이 없습니다</p><div class="empty-sub">검색어나 카테고리를 변경해보세요</div></div></td></tr>`;

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  let start = Math.max(1, state.page - 3);
  let end = Math.min(totalPages, start + 6);
  start = Math.max(1, end - 6);
  const nums = [];
  for (let i = start; i <= end; i++) nums.push(i);
  const arrow = (dir) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${dir==='prev' ? 'M15 18l-6-6 6-6' : 'M9 6l6 6-6 6'}"/></svg>`;
  $('#pagination').innerHTML = `
    <button type="button" class="page-btn" data-page="${state.page-1}" ${state.page===1?'disabled':''} aria-label="이전 페이지">${arrow('prev')}</button>
    ${nums.map(n => `<button type="button" class="page-btn ${n===state.page?'is-active':''}" data-page="${n}" aria-label="${n}페이지" ${n===state.page?'aria-current="page"':''}>${n}</button>`).join('')}
    <button type="button" class="page-btn" data-page="${state.page+1}" ${state.page===totalPages?'disabled':''} aria-label="다음 페이지">${arrow('next')}</button>`;
}

/* ============================================================
   상세 뷰
   ============================================================ */
function renderComments(p){
  $('#cCount').textContent = p.comments.length;
  $('#commentList').innerHTML = p.comments.length
    ? p.comments.map((c,i) => `<li class="comment-item">
        ${avatarHTML(c.author)}
        <div class="comment-body">
          <div class="comment-meta"><span class="name">${esc(c.author)}</span><span class="date">${c.date}</span>
            <button type="button" class="comment-del" data-ci="${i}" aria-label="댓글 삭제">삭제</button></div>
          <div class="comment-text">${esc(c.text)}</div>
        </div>
      </li>`).join('')
    : '<li style="padding:8px 0;color:var(--muted);font-size:13.5px">첫 번째 댓글을 남겨보세요.</li>';
}

function renderDetail(id){
  const p = POSTS.find(x => x.id === id);
  if (!p) return;
  state.currentId = id;
  if (!state.viewed.has(id)){ state.viewed.add(id); p.views++; }

  $('#dCategory').textContent = p.category;
  $('#dCategory').className = 'chip chip-' + p.category;
  $('#dTitle').textContent = p.title;
  $('#dMeta').innerHTML = `${avatarHTML(p.author)}<span style="font-weight:700;color:var(--text)">${esc(p.author)}</span><span class="dot">·</span><span>${p.date}</span><span class="dot">·</span><span>조회 ${nf(p.views)}</span>`;

  if (p.files && p.files.length){
    $('#dAttach').hidden = false;
    $('#dFileList').innerHTML = p.files.map(f => `<div class="file-row">
      <span class="f-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
      <span class="f-name">${esc(f.name)}</span>
      <span class="f-size">${f.size}</span>
    </div>`).join('');
  } else {
    $('#dAttach').hidden = true;
  }

  $('#dContent').innerHTML = p.content.split('\n\n').map(par => `<p>${esc(par).replace(/\n/g,'<br>')}</p>`).join('');

  const idx = filtered.findIndex(x => x.id === id);
  const next = idx > 0 ? filtered[idx-1] : null;
  const prev = (idx >= 0 && idx < filtered.length-1) ? filtered[idx+1] : null;
  const navItem = (item, dir) => item
    ? `<a href="#${item.id}" class="nav-link" data-id="${item.id}"><span class="dir">${dir} 글</span><span class="t">${esc(item.title)}</span></a>`
    : `<div class="nav-link is-empty"><span class="dir off">${dir} 글</span><span class="t">${dir} 글이 없습니다</span></div>`;
  $('#dNav').innerHTML = navItem(prev, '이전') + navItem(next, '다음');

  renderComments(p);
  showView('detail');
}

function showView(name){
  $('#listView').hidden = (name !== 'list');
  $('#detailView').hidden = (name !== 'detail');
  if (name === 'list') state.currentId = null;
  window.scrollTo({ top: 0 });
}

/* ============================================================
   모달 · 토스트 · 테마
   ============================================================ */
const writeModal = $('#writeModal');
let lastFocus = null;

function openModal(){
  lastFocus = document.activeElement;
  writeModal.hidden = false;
  document.body.style.overflow = 'hidden';
  $('#wTitle').focus();
}
function closeModal(){
  writeModal.hidden = true;
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('board-theme', theme); } catch(e){}
}

/* ============================================================
   이벤트 바인딩
   ============================================================ */
$('#categoryTabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  state.category = btn.dataset.cat;
  state.page = 1;
  renderTabs(); renderList();
});

$('#pagination').addEventListener('click', e => {
  const btn = e.target.closest('[data-page]');
  if (!btn || btn.disabled) return;
  state.page = Number(btn.dataset.page);
  renderList();
  $('.table-wrap').scrollIntoView({ behavior:'smooth', block:'start' });
});

$('#postBody').addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) renderDetail(Number(el.dataset.id));
});

$('#dNav').addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) renderDetail(Number(el.dataset.id));
});

$('#commentList').addEventListener('click', e => {
  const el = e.target.closest('[data-ci]');
  if (!el) return;
  const p = POSTS.find(x => x.id === state.currentId);
  if (!p) return;
  p.comments.splice(Number(el.dataset.ci), 1);
  renderComments(p);
  toast('댓글이 삭제되었습니다');
});

$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  state.keyword = $('#searchInput').value.trim();
  state.page = 1;
  renderList();
});

$('#searchInput').addEventListener('search', () => {
  if (!$('#searchInput').value){
    state.keyword = '';
    state.page = 1;
    renderList();
  }
});

$('#backBtn').addEventListener('click', () => showView('list'));

$('#brandBtn').addEventListener('click', e => {
  e.preventDefault();
  state.category = '전체'; state.keyword = ''; state.page = 1;
  $('#searchInput').value = '';
  renderTabs(); renderList(); showView('list');
});

$('#writeBtn').addEventListener('click', openModal);
$('#modalClose').addEventListener('click', closeModal);
$('#cancelBtn').addEventListener('click', closeModal);
writeModal.addEventListener('click', e => { if (e.target === writeModal) closeModal(); });

$('#writeForm').addEventListener('submit', e => {
  e.preventDefault();
  const cat = $('#wCategory').value;
  const author = $('#wAuthor').value.trim() || '익명';
  const title = $('#wTitle').value.trim();
  const content = $('#wContent').value.trim();
  if (!title){ toast('제목을 입력해주세요'); $('#wTitle').focus(); return; }
  if (!content){ toast('내용을 입력해주세요'); $('#wContent').focus(); return; }
  const id = Math.max(...POSTS.map(p => p.id)) + 1;
  POSTS.unshift({ id, category:cat, title, author, date:fmtDate(new Date()), views:0, content, files:[], comments:[] });
  state.category = '전체'; state.keyword = ''; state.page = 1;
  $('#searchInput').value = '';
  renderTabs(); renderList();
  $('#writeForm').reset();
  closeModal();
  showView('list');
  toast('게시글이 등록되었습니다');
});

$('#commentForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#commentInput').value.trim();
  if (!v || !state.currentId) return;
  const p = POSTS.find(x => x.id === state.currentId);
  if (!p) return;
  p.comments.push({ author:'나', text:v, date:fmtDate(new Date()) });
  $('#commentInput').value = '';
  renderComments(p);
  toast('댓글이 등록되었습니다');
});

$('#themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!writeModal.hidden) closeModal();
  else if (state.currentId) showView('list');
});

/* ---------- 초기화 ---------- */
applyTheme(((() => { try { return localStorage.getItem('board-theme'); } catch(e){ return null; } })()) || 'light');
renderTabs();
renderList();
</script>
