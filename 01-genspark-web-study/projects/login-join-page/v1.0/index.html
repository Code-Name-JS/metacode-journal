<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>회원가입 | 새 계정 만들기</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="card" id="card">
        <!-- ===== 가입 폼 ===== -->
        <form id="signupForm" novalidate>
            <div class="brand">
                <div class="logo" aria-hidden="true">S</div>
                <div class="name">Spark</div>
            </div>
            <h1>새 계정 만들기</h1>
            <p class="sub">몇 가지 정보만 입력하면 바로 시작할 수 있어요.</p>

            <!-- 이메일 -->
            <div class="field">
                <label for="email">이메일<span class="required" aria-hidden="true">*</span></label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" aria-describedby="emailError">
                </div>

                <!-- 비밀번호 -->
                <div class="field">
                    <label for="password">비밀번호<span class="required" aria-hidden="true">*</span></label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="8자 이상, 영문·숫자·특수문자" autocomplete="new-password" aria-describedby="pwError strengthText">
                        <button type="button" class="btn-toggle" id="togglePw" aria-label="비밀번호 표시/숨기기">표시</button>
                    </div>
                    <div class="strength" id="strengthWrap">
                        <div class="strength-bar" aria-hidden="true">
                            <span data-i="0"></span>
                            <span data-i="1"></span>
                            <span data-i="2"></span>
                            <span data-i="3"></span>
                        </div>
                        <p class="strength-text" id="strengthText">비밀번호를 입력하면 강도가 표시됩니다.</p>
                    </div>
                    <p class="error-msg" id="pwError" role="alert"></p>
                </div>

                <!-- 비밀번호 확인 -->
                <div class="field">
                    <label for="pwConfirm">비밀번호 확인<span class="required" aria-hidden="true">*</span></label>
                    <div class="input-wrap">
                        <input type="password" id="pwConfirm" name="pwConfirm" placeholder="비밀번호를 한 번 더 입력" autocomplete="new-password" aria-describedby="pwConfirmError">
                        <button type="button" class="btn-toggle" id="togglePwConfirm" aria-label="비밀번호 확인 표시/숨기기">표시</button>
                    </div>
                    <p class="error-msg" id="pwConfirmError" role="alert"></p>
                </div>

                <!-- 인증번호 -->
                <div class="field">
                    <label for="verifyCode">이메일 인증<span class="required" aria-hidden="true">*</span></label>
                    <div class="code-row">
                        <div class="input-wrap">
                            <input type="text" id="verifyCode" name="verifyCode" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" disabled aria-describedby="codeError timerText">
                        </div>
                        <button type="button" class="btn-code" id="btnSendCode">인증번호 발송</button>
                    </div>
                    <p class="timer" id="timerText" hidden></p>
                    <p class="error-msg" id="codeError" role="alert"></p>
                </div>

                <!-- 약관 -->
                <div class="field">
                    <div class="terms">
                        <label class="agree-all" for="agreeAll">
                            <input type="checkbox" id="agreeAll">
                            <span>전체 동의</span>
                        </label>
                        <label class="agree-item" for="agreeRequired1">
                            <input type="checkbox" id="agreeRequired1" class="required-check">
                            <span>서비스 이용약관 동의 <span class="required">(필수)</span></span>
                            <a href="#" onclick="return false;">보기</a>
                        </label>
                        <label class="agree-item" for="agreeRequired2">
                            <input type="checkbox" id="agreeRequired2" class="required-check">
                            <span>개인정보 처리방침 동의 <span class="required">(필수)</span></span>
                            <a href="#" onclick="return false;">보기</a>
                        </label>
                        <label class="agree-item" for="agreeOptional">
                            <input type="checkbox" id="agreeOptional">
                            <span>마케팅 정보 수신 동의 <span class="opt">(선택)</span></span>
                            <a href="#" onclick="return false;">보기</a>
                        </label>
                    </div>
                    <p class="error-msg" id="termsError" role="alert"></p>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">가입하기</button>

                <p class="login-link">이미 계정이 있으신가요? <a href="#" onclick="return false;">로그인</a></p>
            </div>
        </form>

        <!-- ===== 성공 화면 ===== -->
        <div class="success" id="successBox" role="status">
            <div class="check" aria-hidden="true">✓</div>
            <h2>가입이 완료되었습니다!</h2>
            <p id="successMsg">환영합니다. 이제 모든 기능을 이용할 수 있어요.</p>
            <button type="button" class="btn-submit" id="btnGoLogin">로그인하러 가기</button>
        </div>
    </main>

    <script src="./main.js"></script>
</body>
</html>
