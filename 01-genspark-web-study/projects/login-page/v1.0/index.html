<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>login-page·My-App</title>

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=lnter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
        
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fotawesome-free@6.4.0/css/all.min.css"/>
        <link rel="stylesheet" href="style.css"/>
    </head>

    <body>
        <!-- ── background decoration ── -->
        <div class="bg-blobs" aria-hidden="true">
            <span class="blob blob-1"></span>
            <span class="blob blob-2"></span>
            <span class="blob blob-3"></span>
        </div>

        <!-- ── main card ── -->
        <main class="login-wrapper">
            <article class="login-card">

                <!-- brand -->
                <header class="card-header">
                    <div class="brand-icon">
                        <i class="fa-solid fa-bolt"></i>
                    </div>

                    <h1 class="brand-name">My-App</h1>
                    <p class="brand-tagline">Nice to see you again! 👋</p>
                </header>

                <!-- social login -->
                <section class="social-login" aria-label="social login">
                    <button class="btn-social btn-google" id="btn-google" type="button">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/icons/google/google-original.svg" alt="Google" width="20" height="20" />
                        Continue with Google
                    </button>

                    <button class="btn-social btn-github" id="btn-github" type="button">
                        <i class="fa-brands fa-github"></i>
                        Continue to GitHub
                    </button>  
                </section>

                <!-- separator -->
                <div class="divider" role="separator">
                    <span>Or log in with email</span>  
                </div>

                <!-- Login Form -->
                <form id="login-form" class="login-form" novalidate>

                    <!-- email -->
                    <div class="field-group" id="group-email">
                        <label class="field-label" for="email">email</label>
                        <div class="field-input-wrap">
                            <i class="fa-regular fa-envelope field-icon"></i>
                            <input id="email" class="field-input" type="email" placeholder="example@email.com" autocomplete="email" required/>
                        </div>
                        <p class="field-error" id="error-email" role="alert" aria-live="polite"></p>
                    </div>

                    <!-- Password -->
                    <div class="field-group" id="group-password">
                        <label class="field-label" for="password">password</label>
                        <div class="field-input-wrap">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input id="password" class="field-input" type="password" placeholder="Please enter your PIN number." autocomplete="current-password" required/>
                            <button type="button" class="btn-toggle-pw" id="toggle-pw" aria-label="Show/Hide Password">
                                <i class="fa-regular fa-eye" id="eye-icon"></i>
                            </button>
                        </div>
                        <p class="fa-regular fa-eye" id="eye-icon"></p>
                    </div>

                    <!-- Option line -->
                    <div class="options-row">
                        <label class="checkbox-wrap">
                            <input type="checkbox" id="remember-me"/>
                            <span class="custom-check"></span>
                            Keep me logged in
                        </label>
                        <a href="#" class="link-forgot" id="link-forgot">Find Password</a>
                    </div>

                    <!-- Submit button -->
                    <button type="submit" class="btn-submit" id="btn-submit">
                        <span class="btn-text">Login</span>
                        <span class="btn-spinner" id="btn-spinner" aria-hidden="true">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                        </span>
                    </button>

                    <!-- Toast Message -->
                    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

                </form>

                <!-- Encourage sign-up -->
                <footer class="card-footer">
                    Don't have an account?
                    <a href="#" class="link-signup" id="link-signup">Join Membership</a>
                </footer>
            </article>
        </main>

        <script src="./main.js"></script>
    </body>
</html>
