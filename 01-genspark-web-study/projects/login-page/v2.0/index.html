<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <title>login-page·MyApp·v2</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>

    <!-- ── 전체 래퍼 ── -->
    <div class="page-wrap">

        <!-- ════ 왼쪽 패널 (비주얼) ════ -->
        <aside class="panel-left" aria-hidden="true">

            <!-- 노이즈 오버레이 -->
            <div class="panel-noise"></div>

            <!-- 상단 로고 -->
            <div class="panel-logo">
                <span class="logo-dot"></span>
                <span class="logo-text">MyApp</span>
            </div>

            <!-- 중앙 일러스트 -->
            <div class="panel-center">
                
                <!-- Orbit -->
                <div class="orbit-wrap">
                    <div class="orbit orbit-1">
                        <span class="orbit-dot dot-cyan"></span>
                    </div>
                    <div class="orbit orbit-2">
                        <span class="orbit-dot dot-pink"></span>
                    </div>
                    <div class="orbit orbit-3">
                        <span class="orbit-dot dot-yellow"></span>
                    </div>

                    <!-- 중심 아이콘 -->
                    <div class="orbit-core">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

                <h2 class="panel-heading">안전하게 시작하세요.</h2>
                <p class="panel-sub">
                    당신의 데이터는 최고 수준의 암호화로<br/>철저하게 보호됩니다.
                </p>
            </div>

            <!-- 하단 스탯 -->
            <footer class="panel-stats">
                <div class="stat-item">
                    <span class="stat-num" data-target="98">0</span><span class="stat-unit">%</span>
                    <span class="stat-label">가동률</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-num" data-target="256">0</span><span class="stat-unit">bit</span>
                    <span class="stat-label">암호화</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-num" data-target="24">0</span><span class="stat-unit">/7</span>
                    <span class="stat-label">모니터링</span>
                </div>
            </footer>
        </aside>

        <!-- ════ 오른쪽 패널 (폼) ════ -->
        <main class="panel-right">

            <!-- 모바일 로고 -->
            <div class="mobile-logo">
                <span class="logo-dot"></span>
                <span class="logo-text">MyApp</span>
            </div>

            <section class="form-section">
                
                <!-- 탭: 로그인 / 회원가입 -->
                <div class="tab-group" role="tablist">
                    <button class="tab active" id="tab-login" role="tab" aria-selected="true">로그인</button>
                    <button class="tab" id="tab-signup" role="tab" aria-selected="false">회원가입</button>
                    <span class="tab-indicator"></span>
                </div>

                <!-- 로그인 폼 -->
                <form id="form-login" class="auth-form" novalidate>
                    <h1 class="form-title">다시 만나서 반가워요 <span class="wave">👋</span></h1>
                    <p class="form-desc">계정에 로그인하여 서비스를 이용하세요.</p>

                    <!-- 이메일 -->
                    <div class="field" id="f-email">
                        <label for="email">이메일 주소</label>
                        <div class="input-box">
                            <i class="fa-regular fa-envelope"></i>
                            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
                        </div>
                        <span class="err-msg" id="err-email"></span>
                    </div>

                    <!-- 비밀번호 -->
                    <div class="field" id="f-pass">
                        <div class="label-row">
                            <label for="password">비밀번호</label>
                            <a href="#" class="forgot" id="link-forgot">잊어버렸어요</a>
                        </div>
                        <div class="input-box">

                            <!-- 왼쪽 잠금 아이콘 -->
                            <i class="fa-solid fa-lock password-lock"></i>

                            <!-- 비밀번호 입력 -->
                            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
                            
                            <!-- 오른쪽 눈 아이콘 -->
                            <button type="button" class="eye-btn" id="eye-btn" aria-label="비밀번호 표시">
                                <i class="fa-regular fa-eye" id="eye-ic"></i>
                            </button>
                        </div>
                        <span class="err-msg" id="err-pass"></span>
                    </div>

                    <!-- 로그인 유지 -->
                    <label class="check-label">
                        <input type="checkbox" id="remember" />
                        <span class="check-box"></span>
                        이 기기에서 로그인 유지
                    </label>

                    <!-- 제출 -->
                    <button type="submit" class="btn-main" id="btn-login">
                        <span class="btn-label">로그인</span>
                        <i class="fa-solid fa-arrow-right btn-arrow"></i>
                        <span class="btn-loader" id="loader"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
                    </button>

                    <!-- 알림 배너 -->
                    <div class="alert-banner" id="alert-login"></div>

                    <!-- 구분선 -->
                    <div class="or-line"><span>OR</span></div>

                    <!-- 소셜 -->
                    <div class="social-row">
                        <button type="button" class="btn-social-v2" id="s-google">
                            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" width="18" height="18" />
                            Google
                        </button>
                        <button type="button" class="btn-social-v2" id="s-kakao">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#3A1D1D">
                            <path d="M12 3C6.477 3 2 6.582 2 11.045c0 2.857 1.866 5.369 4.7 6.841L5.6 21l4.37-2.876A12.2 12.2 0 0012 18.09c5.523 0 10-3.582 10-8.045S17.523 3 12 3z" />
                            </svg>
                            카카오
                        </button>
                        <button type="button" class="btn-social-v2" id="s-naver">
                            <span class="naver-n">N</span>
                            네이버
                        </button>
                    </div>
                </form>

                <!-- 하단 링크 -->
                <p class="bottom-hint">
                    <i class="fa-solid fa-shield-halved"></i>
                    보안 연결 · SSL 암호화 · GDPR 준수
                </p>
            </section>
        </main>
    </div><!-- /page-wrap -->

    <script src="./main.js" defer></script>
</body>
</html>
