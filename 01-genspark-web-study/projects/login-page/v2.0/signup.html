<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <title>login-page·MyApp·v2</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./style.css"/>
</head>

<body>
    <!-- ── 전체 래퍼 ── -->
    <div class="page-wrap">

        <!-- ════ 왼쪽 패널 (비주얼) ════ -->
        <aside class="panel-left" aria-hidden="true">
            
            <!-- 노이즈 오버레이 -->
            <div class="panel-noise"></div>

            <!-- 상단 로고 -->
            <div class="panel-logo">
                <span class="logo-dot"></span>
                <span class="logo-text">MyApp</span>
            </div>

            <!-- 중앙 일러스트 -->
            <div class="panel-center">

                <!-- Orbit -->
                <div class="orbit-wrap">
                    <div class="orbit orbit-1">
                        <span class="orbit-dot dot-cyan"></span>
                    </div>
                    <div class="orbit orbit-2">
                        <span class="orbit-dot dot-pink"></span>
                    </div>
                    <div class="orbit orbit-3">
                        <span class="orbit-dot dot-yellow"></span>
                    </div>

                    <!-- 중심 아이콘 -->
                    <div class="orbit-core">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

                <h2 class="panel-heading">안전하게 시작하세요.</h2>
                <p class="panel-sub">
                    당신의 데이터는 최고 수준의 암호화로<br/>철저하게 보호됩니다.
                </p>
            </div>
        </aside>


        <!-- ════ 오른쪽 패널 (폼) ════ -->
        <main class="panel-right">

            <!-- 모바일 로고 -->
            <div class="mobile-logo">
                <span class="logo-dot"></span>
                <span class="logo-text">MyApp</span>
            </div>
            
            <section class="form-section">

                <!-- 탭: 로그인 / 회원가입 -->
                <div class="tab-group on-signup" role="tablist">
                    <button class="tab" id="tab-login" type="button" role="tab" aria-selected="false">로그인</button>
                    <button class="tab active" id="tab-signup" type="button" role="tab" aria-selected="true">회원가입</button>
                    <span class="tab-indicator"></span>
                </div>

                <!-- 회원가입 폼 -->
                <form id="form-signup" class="auth-form" novalidate>
                    <h1 class="form-title">처음 오셨군요! <span class="wave">🎉</span></h1>
                    <p class="form-desc">몇 가지 정보만 입력하면 바로 시작할 수 있어요.</p>

                    <!-- 이름 -->
                    <div class="field" id="f-name">
                        <label for="username">이름</label>
                        <div class="input-box">
                            <i class="fa-regular fa-user"></i>
                            <input id="username" type="text" placeholder="이름을 입력해주세요." autocomplete="name" required />
                        </div>
                        <span class="err-msg" id="err-su-name"></span>
                    </div>

                    <!-- 이메일 -->
                    <div class="field" id="f-su-email">
                        <label for="su-email">
                            이메일 주소
                        </label>
                        <div class="input-box">
                            <i class="fa-regular fa-envelope"></i>
                            <input id="su-email" type="email" placeholder="you@example.com" autocomplete="email" required />
                        </div>

                        <span class="err-msg" id="err-su-email"></span>
                    </div>

                    <!-- 비밀번호 -->
                    <div class="field" id="f-su-pass">
                        <label for="su-pass">
                            비밀번호
                        </label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input id="su-pass" type="password" placeholder="비밀번호는 8자 이상 입력해주세요." required />

                            <button type="button" class="eye-btn" id="eye-btn2" aria-label="비밀번호 표시">
                                <i class="fa-regular fa-eye" id="eye-ic2"></i>
                            </button>
                        </div>

                        <!-- 비밀번호 에러 메시지 -->
                        <span class="err-msg" id="err-su-pass"></span>
                    </div>

                    <!-- 비밀번호 강도 -->
                    <div class="strength-wrap">
                        <div class="strength-bar">
                            <span class="sb" id="sb1"></span>
                            <span class="sb" id="sb2"></span>
                            <span class="sb" id="sb3"></span>
                            <span class="sb" id="sb4"></span>
                        </div>

                        <span class="strength-label" id="strength-label">
                             강도 없음
                        </span>
                    </div>
                


                    <!-- Terms -->
                    <label class="check-label">
                        <input type="checkbox" id="agree" />
                        <span class="check-box"></span>
                        <span>
                            <a href="#" class="inline-link">
                                이용약관
                            </a>

                            및
                            
                            <a href="#" class="inline-link">
                            개인정보처리방침
                            </a>에 동의합니다.
                        </span>
                    </label>


                    <!-- Submit -->
                    <button type="submit" class="btn-main" id="btn-signup">
                        <span class="btn-label">
                            회원가입
                        </span>

                        <i class="fa-solid fa-arrow-right btn-arrow"></i>

                        <span class="btn-loader" id="loader2">
                            <i class="fa-solid fa-circle-exclamation fa-spin"></i>
                        </span>
                    </button>
                    <div class="alert-banner" id="alert-signup"></div>
                </form>
            </section>


            <!-- 하단 링크 -->
            <p class="bottom-hint">
                <i class="fa-solid fa-shield-halved"></i>
                보안 연결 · SSL 암호화 · GDPR 준수
            </p>
        </main>
    </div>

    <script src="./signup-main.js" defer></script>
</body>
</html>
