<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 요소에 속성 추가하기·MDN</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="box">
        <h2>Live output</h2>
        <div class="output"></div>
        <br>

        <h2>Editable code</h2>
        <div class="small-text">Press Esc to move focus away from the code area (Tab inserts a tab character).</div>
        <textarea id="code" placeholder="&lt;p&gt;A link to my favorite website.&lt;/p&gt;"></textarea>

        <div class="button">
            <input id="reset" type="button" value="Reset" />
            <input id="solution" type="button" value="Show solution" />
        </div>
    </div>

    <script src="./script.js" defer></script>
</body>
</html>
