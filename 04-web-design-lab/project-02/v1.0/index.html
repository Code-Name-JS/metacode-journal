<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첫 번째 HTML 요소 만들기·MDN</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="box">
        <p class="bold-text">Live output</p>
        <div class="output"></div>
        <br>

        <p class="bold-text">Editable code</p>
        
        <div class="small-text">코드 영역에서 포커스를 이동하려면 Esc키를 누르십시오 (Tab키로 탭 문자를 삽입).</div>
        <textarea id="code" placeholder="This is my text"></textarea>
        
        <div>
            <input id="reset" type="button" value="Reset" />
            <input id="solution" type="button" value="Show solution" />
        </div>
    </div>

    <script src="./script.js" defer></script>
</body>
</html>
