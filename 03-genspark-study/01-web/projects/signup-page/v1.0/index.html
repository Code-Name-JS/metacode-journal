<!DOCTYPE html>
<html lang="ko" data-theme="aurora">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="글래스모피즘 스타일 회원가입 페이지 시안 - 실시간 유효성 검사, 비밀번호 강도 미터, 테마 전환 지원">
    <title>회원가입·Aurora</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
</head>
<body>

    <!-- 배경 레이어 -->
    <div class="bg" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
    </div>
    <div class="grid-overlay" aria-hidden="true"></div>

    <!-- 테마 전환 -->
    <div class="theme-switch" role="group" aria-label="테마 색상 선택">
        <button class="dot" type="button" data-theme-set="aurora" aria-pressed="true" aria-label="오로라 테마"><span></span></button>
        <button class="dot" type="button" data-theme-set="sunset" aria-pressed="false" aria-label="선셋 테마"><span></span></button>
        <button class="dot" type="button" data-theme-set="mint" aria-pressed="false" aria-label="민트 테마"><span></span></button>
    </div>

    <mian class="stage">
        <section class="card" aria-labelledby="pageTitle">

            <!-- 좌측 브랜드 패널 -->
            <aside class="brand">
                <div class="logo">
                    <span class="logo-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2.8 20 7v10l-8 4.2L4 17V7l8-4.2Z"/>
                            <path d="M12 12v9.2M12 12 4 7M12 12l8-5"/>
                        </svg>
                    </span>
                    <span>Aurora</span>
                </div>

                <h1>지금 합류하고<br>팀의 워크플로를<br>한 단계 끌어올리세요</h1>
                <p class="sub">가입 후 3분이면 첫 프로젝트를 만들 수 있습니다. 신용카드 등록 없이 바로 시작하세요.</p>
            
                <ul class="benefits">
                    <li>
                        <span class="tick" aria-hidden="true">✓</span>
                        <span><b>무료로 시작</b><small>14일 동안 모든 기능을 제한 없이 사용</small></span>
                    </li>
                    <li>
                        <span class="tick" aria-hidden="true">✓</span>
                        <span><b>실시간 협업</b><small>팀원 초대와 동시 편집을 기본 제</small></span>
                    </li>
                    <li>
                        <span class="tick" aria-hidden="true">✓</span>
                        <span><b>데이터 보호</b><small>전 구간 암호화와 2단계 인증 지원</small></span>
                    </li>
                </ul>

                <figure class="quote">
                    <blockquote>"온보딩 흐름을 바꾼 뒤 첫 주 이탈률이 눈에 띄게 줄었어요."</blockquote>
                    <figcaption>김하늘 · 프로덕트 리드</figcaption>
                </figure>
            </aside>

            <!-- 우측 폼 패널 -->
            <div class="pane">

                <!-- 가입 폼 -->
                <div id="formView">
                    <header class="pane-head">
                        <p class="eyebrow">Create account</p>
                        <h2 id="pageTitle">회원가입</h2>
                        <p>이미 계정이 있으신가요? <a href="#">로그인</a></p>
                    </header>

                    <form id="signupForm" novalidate>

                        <!-- 이름 -->
                        <div class="field" data-field="name">
                            <label for="name">이름</label>
                            <div class="input-wrap">
                                <svg class="'lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cs="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
                                </svg>
                                <input id="name" name="name" type="text" placeholder="홍길동" autocomplete="name" inputmode="text" required aria-describedb="nameMsg">
                                <span class="status" aria-hidden="true">
                                    <svg class="ic ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.7 2.7L16 9.6"/></svg>
                                    <svg class="ic err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.6v5.2M12 16.4h.01"/></svg>
                                </span>
                            </div>
                            <p class="msg" id="nameMsg" role="status">실명 또는 활동명을 2자 이상 입력해 주세요.</p>
                        </div>

                        <!-- 이메일 -->
                        <div class="field" data-field="email">
                            <label for="email">이메일</label>
                            <div class="input-wrap">
                                <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7.5 8 5.2 8-5.2"/>
                                </svg>
                                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" spellcheck="false" required aria-describedby="emailMsg">
                                <span class="status" aria-hidden="true">
                                    <svg class="ic ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.7 2.7L16 9.6"/></svg>
                                    <svg class="ic err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.6v5.2M12 16.4h.01"/></svg>
                                </span>
                            </div>
                            <p class="msg" id="emailMsg" role="status">로그인과 알림 수신에 사용됩니다.</p>
                        </div>

                        <!-- 비밀번호 -->
                        <div class="field" data-field="password">
                            <label for="password">비밀번호</label>
                            <div class="input-wrap with-toggle">
                                <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="4.5" y="10.5" width="15" height="10" rx="2.6"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5"/>
                                </svg>
                                <input id="password" name="password" type="password" placeholder="8자 이상 입력" autocomplete="new-password" required minlength="8" aria-describedby="passwordMsg">
                                <span class="status" aria-hidden="true">
                                    <svg class="ic ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.7 2.7L16 9.6"/></svg>
                                    <svg class="ic err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.6v5.2M12 16.4h.01"/></svg>
                                </span>

                                
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </mian>
    <script src="./main.js" defer></script>
</body>
</html>
