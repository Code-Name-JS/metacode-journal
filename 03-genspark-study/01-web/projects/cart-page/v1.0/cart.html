<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="모모샵 장바구니 데모 — HTML/CSS/JS 단일 파일 장바구니 리스트 페이지">
<title>장바구니 — 모모샵</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f5fa;
    --card: #ffffff;
    --ink: #191b23;
    --ink2: #667085;
    --ink3: #98a2b3;
    --line: #e6e8f0;
    --brand: #5b5bd6;
    --brand-dark: #4747c2;
    --brand-soft: #eef0ff;
    --green: #0e9f6e;
    --green-soft: #e6f7f1;
    --red: #e5484d;
    --red-soft: #feefef;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(25, 27, 35, .07);
    --topbar-h: 64px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  svg { display: block; }

  .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  /* ── 상단 바 ─────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in { height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; text-decoration: none; color: inherit; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #6a5cf5, #9b5cf6); display: grid; place-items: center; color: #fff; }
  .topnav { display: flex; gap: 4px; }
  .topnav a { color: var(--ink2); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px; transition: .15s; }
  .topnav a:hover, .topnav a.active { background: var(--brand-soft); color: var(--brand); }
  @media (max-width: 640px) { .topnav { display: none; } }

  /* ── 페이지 헤더 ─────────────────────── */
  .page-head { display: flex; align-items: center; justify-content: space-between; margin: 32px 0 20px; gap: 12px; }
  h1 { font-size: 26px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
  .count-badge { min-width: 30px; height: 30px; padding: 0 9px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 15px; display: grid; place-items: center; font-weight: 700; }
  .link-btn { color: var(--ink2); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .link-btn:hover { color: var(--red); }

  /* ── 레이아웃 ────────────────────────── */
  .cart-layout { display: grid; grid-template-columns: 1fr 356px; gap: 24px; align-items: start; padding-bottom: 80px; }
  @media (max-width: 1020px) { .cart-layout { grid-template-columns: 1fr; } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

  /* ── 리스트 툴바 ─────────────────────── */
  .list-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .check-all { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .check-all em { font-style: normal; color: var(--ink2); font-weight: 600; font-size: 13px; }
  .ghost-btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--ink2); transition: .15s; }
  .ghost-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }

  /* ── 커스텀 체크박스 ─────────────────── */
  input[type="checkbox"].cb {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; flex: none;
    border: 2px solid #cfd3e1; border-radius: 6px;
    background: #fff; cursor: pointer; position: relative; transition: .15s;
  }
  input[type="checkbox"].cb:hover { border-color: var(--brand); }
  input[type="checkbox"].cb:checked { background: var(--brand); border-color: var(--brand); }
  input[type="checkbox"].cb:checked::after {
    content: ''; position: absolute; left: 4px; top: 0.5px;
    width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  input[type="checkbox"].cb:indeterminate { background: var(--brand); border-color: var(--brand); }
  input[type="checkbox"].cb:indeterminate::after { content: ''; position: absolute; left: 2.5px; top: 6.5px; width: 10px; height: 2.5px; background: #fff; border-radius: 2px; }

  /* ── 상품 행 ─────────────────────────── */
  .cart-list { list-style: none; }
  .item {
    display: grid;
    grid-template-columns: auto 72px 1fr 150px 130px;
    grid-template-areas: "check thumb info qty total";
    gap: 18px; align-items: center;
    padding: 20px; border-bottom: 1px solid var(--line);
    transition: background .15s;
  }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #fafbff; }
  .cell-check { grid-area: check; }
  .cell-thumb {
    grid-area: thumb; width: 72px; height: 72px; border-radius: 14px;
    display: grid; place-items: center; font-size: 32px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04);
  }
  .item-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .item-meta { color: var(--ink2); font-size: 13px; margin-top: 4px; }
  .cell-qty { grid-area: qty; justify-self: start; }
  .cell-right { grid-area: total; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
  .line-total { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
  .remove-btn { display: inline-flex; align-items: center; gap: 5px; color: var(--ink3); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; transition: .15s; }
  .remove-btn:hover { color: var(--red); background: var(--red-soft); }
  .remove-btn svg { width: 13px; height: 13px; }

  /* ── 수량 스테퍼 ─────────────────────── */
  .qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .qty-btn { width: 34px; height: 36px; display: grid; place-items: center; color: var(--ink2); transition: .12s; }
  .qty-btn svg { width: 14px; height: 14px; }
  .qty-btn:hover:not(:disabled) { background: var(--brand-soft); color: var(--brand); }
  .qty-btn:disabled { opacity: .3; cursor: not-allowed; }
  .qty input { width: 44px; height: 36px; border: 0; text-align: center; font: inherit; font-weight: 700; font-size: 14px; color: var(--ink); background: transparent; }
  .qty input:focus { outline: none; background: var(--brand-soft); }
  .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

  /* ── 주문 요약 (스티키) ───────────────── */
  .summary { position: sticky; top: calc(var(--topbar-h) + 24px); }
  .summary-card { padding: 22px; }
  .summary h2 { font-size: 17px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  .ship-label { font-size: 12.5px; font-weight: 600; color: var(--ink2); }
  .ship-label.done { color: var(--green); }
  .progress { height: 8px; background: #eef0f6; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #19c37d, #0e9f6e); border-radius: 99px; transition: width .4s ease; }

  .coupon-box { margin: 18px 0; padding: 14px; border: 1px dashed #d6d9ea; border-radius: 12px; background: #fafbff; }
  .coupon-box label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--ink2); }
  select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; background: #fff; cursor: pointer; color: var(--ink); }
  select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(91, 91, 214, .15); }

  .sum-rows { display: grid; gap: 10px; margin-top: 4px; }
  .sum-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink2); }
  .sum-row b { color: var(--ink); font-weight: 700; }
  .sum-row.discount b { color: var(--red); }
  .sum-row.ship s { color: var(--ink3); margin-right: 6px; font-weight: 400; }
  .sum-row.ship b.free { color: var(--green); }

  .sum-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
  .sum-total span { font-weight: 700; }
  .sum-total b { font-size: 24px; letter-spacing: -.02em; color: var(--brand-dark); }
  .points-note { margin-top: 10px; font-size: 12.5px; color: var(--green); font-weight: 600; text-align: right; min-height: 1em; }

  .btn-primary {
    width: 100%; margin-top: 18px; padding: 15px; border-radius: 12px;
    background: var(--brand); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -.01em;
    transition: .15s; box-shadow: 0 6px 16px rgba(91, 91, 214, .35);
  }
  .btn-primary:hover { background: var(--brand-dark); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .summary-note { margin-top: 12px; font-size: 12px; color: var(--ink3); line-height: 1.6; }

  /* ── 빈 장바구니 ─────────────────────── */
  .empty { padding: 80px 24px; text-align: center; }
  .empty-emoji { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%; background: var(--brand-soft); display: grid; place-items: center; font-size: 40px; }
  .empty h2 { font-size: 19px; margin-bottom: 8px; }
  .empty p { color: var(--ink2); font-size: 14px; margin-bottom: 24px; }
  .btn-soft { padding: 12px 22px; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 700; font-size: 14px; transition: .15s; }
  .btn-soft:hover { background: var(--brand-dark); }

  /* ── 모바일 하단 바 ───────────────────── */
  .mobile-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    background: #fff; border-top: 1px solid var(--line);
    box-shadow: 0 -8px 24px rgba(25, 27, 35, .08);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: none; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  }
  .mobile-bar .mb-label { font-size: 12px; color: var(--ink2); font-weight: 600; }
  .mobile-bar .mb-total { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .mobile-bar .btn-primary { width: auto; margin: 0; padding: 12px 22px; }
  @media (max-width: 920px) { .mobile-bar { display: grid; } }

  /* ── 토스트 ──────────────────────────── */
  .toast {
    position: fixed; left: 50%; bottom: 32px; z-index: 200;
    transform: translate(-50%, 16px);
    background: #23252e; color: #fff; padding: 12px 20px; border-radius: 12px;
    font-size: 14px; font-weight: 600; max-width: calc(100vw - 40px); text-align: center;
    opacity: 0; pointer-events: none; transition: .25s;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 920px) { .toast { bottom: 96px; } }

  footer { padding: 24px 0 40px; text-align: center; color: var(--ink3); font-size: 12.5px; }

  /* ── 모바일: 행 → 카드 재배치 ─────────── */
  @media (max-width: 760px) {
    .item {
      grid-template-columns: auto 60px 1fr auto;
      grid-template-areas:
        "check thumb info total"
        "check thumb qty total";
      gap: 8px 14px; padding: 16px; align-items: start;
    }
    .cell-thumb { width: 60px; height: 60px; font-size: 26px; border-radius: 12px; }
    .cell-right { align-self: center; }
    .line-total { font-size: 15px; }
    .qty-btn { width: 30px; height: 32px; }
    .qty input { width: 38px; height: 32px; }
    .cell-qty { justify-self: start; }
    .page-head { margin: 24px 0 16px; }
    h1 { font-size: 22px; }
  }

  :focus-visible { outline: 3px solid rgba(91, 91, 214, .45); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="container topbar-in">
    <a class="brand" href="#">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/></svg>
      </span>
      모모샵
    </a>
    <nav class="topnav" aria-label="주 메뉴">
      <a href="#">홈</a>
      <a href="#">신상품</a>
      <a href="#">베스트</a>
      <a href="#" class="active" aria-current="page">장바구니</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="page-head">
    <h1>장바구니 <span class="count-badge" id="headCount">0</span></h1>
    <button type="button" class="link-btn" id="resetBtn">샘플 데이터 초기화</button>
  </div>

  <div class="cart-layout">
    <!-- 상품 목록 -->
    <section class="panel" aria-label="담은 상품 목록">
      <div id="listWrap">
        <div class="list-toolbar">
          <label class="check-all">
            <input type="checkbox" class="cb" id="checkAll">
            <span>전체선택 <em id="selCount">(0/0)</em></span>
          </label>
          <button type="button" class="ghost-btn" id="deleteSelected">선택삭제</button>
        </div>
        <ul class="cart-list" id="cartList"></ul>
      </div>

      <div class="empty" id="emptyState" hidden>
        <div class="empty-emoji" aria-hidden="true">🛒</div>
        <h2>장바구니가 비어 있습니다</h2>
        <p>샘플 상품을 다시 담아 다양한 기능을 체험해 보세요.</p>
        <button type="button" class="btn-soft" id="emptyReset">샘플 상품 담아보기</button>
      </div>
    </section>

    <!-- 주문 요약 -->
    <aside class="summary" aria-label="주문 요약">
      <div class="panel summary-card">
        <h2>주문 예상 금액</h2>

        <div class="ship-progress">
          <p class="ship-label" id="shipLabel"></p>
          <div class="progress" id="shipProgress" role="progressbar" aria-label="무료배송 달성 현황" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="shipFill" style="width:0%"></div>
          </div>
        </div>

        <div class="coupon-box">
          <label for="couponSelect">할인쿠폰</label>
          <select id="couponSelect">
            <option value="none">사용 가능한 쿠폰 선택</option>
            <option value="pct10">10% 할인 쿠폰 (최대 30,000원)</option>
            <option value="save5000">5,000원 정액 쿠폰 (5만원 이상)</option>
          </select>
        </div>

        <div class="sum-rows">
          <div class="sum-row"><span>선택 상품 금액</span><b id="sumSubtotal">0원</b></div>
          <div class="sum-row discount"><span>쿠폰 할인</span><b id="sumDiscount">0원</b></div>
          <div class="sum-row ship"><span>배송비</span><b id="sumShip">0원</b></div>
        </div>

        <div class="sum-total">
          <span>총 결제 금액</span>
          <b id="sumTotal" aria-live="polite">0원</b>
        </div>
        <p class="points-note" id="sumPoints"></p>

        <button type="button" class="btn-primary" id="checkoutBtn">총 <span id="checkoutCount">0</span>개 상품 주문하기</button>
        <p class="summary-note">
          본 페이지는 데모이며 실제 결제가 진행되지 않습니다.<br>
          장바구니 상태는 브라우저(localStorage)에 자동 저장됩니다.
        </p>
      </div>
    </aside>
  </div>
</main>

<footer class="container">© 2026 MOMOSHOP DEMO — 학습용 데모 페이지</footer>

<!-- 모바일 하단 결제 바 -->
<div class="mobile-bar" id="mobileBar" hidden>
  <div>
    <p class="mb-label">총 결제 금액</p>
    <p class="mb-total" id="mbTotal" aria-live="polite">0원</p>
  </div>
  <button type="button" class="btn-primary" id="mobileCheckout">주문하기</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const $  = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];

/* ── 상수 & 설정 ─────────────────────────── */
const SHIPPING_FEE      = 3000;     // 기본 배송비
const FREE_SHIPPING_MIN = 500000;   // 무료배송 기준 금액
const QTY_MIN = 1, QTY_MAX = 99;
const STORAGE_KEY = 'cart-page-demo-v1';

const COUPONS = {
  none:     { calc: () => 0 },
  pct10:    { calc: sub => Math.min(Math.floor(sub * 0.1), 30000) },
  save5000: { calc: sub => (sub >= 50000 ? 5000 : 0) },
};

/* ── 샘플 데이터 (썸네일은 그라디언트 + 이모지) ── */
const DEMO_ITEMS = [
  { id: 'p1', name: '무선 노이즈캔슬링 헤드폰', option: '미드나잇 블랙',   price: 189000, qty: 1, checked: true,  emoji: '🎧', bg: 'linear-gradient(135deg,#c2b6f6,#8fb8f5)' },
  { id: 'p2', name: '스마트워치 시리즈 9',      option: '45mm 스타라이트', price: 429000, qty: 1, checked: false, emoji: '⌚', bg: 'linear-gradient(135deg,#ffd8a8,#ffa8a8)' },
  { id: 'p3', name: '러닝 슈즈 에어플로우',     option: '화이트 / 270mm',  price:  89000, qty: 1, checked: false, emoji: '👟', bg: 'linear-gradient(135deg,#b8f2d8,#8fe3f0)' },
  { id: 'p4', name: '캠핑 미니 화로대',         option: '스테인리스 스틸', price:  45000, qty: 1, checked: true,  emoji: '🏕️', bg: 'linear-gradient(135deg,#ffe3a3,#ffc4a3)' },
];

/* ── 상태 ────────────────────────────────── */
let state = load() || JSON.parse(JSON.stringify({ items: DEMO_ITEMS, coupon: 'none' }));

/* ── 유틸 ────────────────────────────────── */
const fmtNum = n => n.toLocaleString('ko-KR');
const fmt    = n => `${fmtNum(n)}원`;

const ICONS = {
  minus: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  plus:  '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6"/></svg>',
};

/* ── 저장 / 복원 (localStorage) ──────────── */
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 실패 무시 */ }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.items)) return null;
    data.items = data.items.filter(i =>
      i && typeof i.id === 'string' && typeof i.name === 'string' &&
      typeof i.price === 'number' && typeof i.qty === 'number'
    );
    if (!COUPONS[data.coupon]) data.coupon = 'none';
    return data;
  } catch (e) { return null; }
}

/* ── 렌더링 ──────────────────────────────── */
function itemHTML(it) {
  return `<li class="item" data-id="${it.id}">
    <div class="cell-check">
      <input type="checkbox" class="cb item-check" id="chk-${it.id}" data-id="${it.id}" ${it.checked ? 'checked' : ''} aria-label="${it.name} 선택">
    </div>
    <div class="cell-thumb" style="background:${it.bg}" aria-hidden="true"><span>${it.emoji}</span></div>
    <div class="cell-info">
      <p class="item-name">${it.name}</p>
      <p class="item-meta">${it.option} · ${fmt(it.price)}</p>
    </div>
    <div class="cell-qty">
      <div class="qty" role="group" aria-label="${it.name} 수량 조절">
        <button type="button" class="qty-btn" data-action="dec" data-id="${it.id}" aria-label="${it.name} 수량 감소" ${it.qty <= QTY_MIN ? 'disabled' : ''}>${ICONS.minus}</button>
        <input type="number" class="qty-input" data-id="${it.id}" value="${it.qty}" min="${QTY_MIN}" max="${QTY_MAX}" inputmode="numeric" aria-label="${it.name} 수량 직접 입력">
        <button type="button" class="qty-btn" data-action="inc" data-id="${it.id}" aria-label="${it.name} 수량 증가" ${it.qty >= QTY_MAX ? 'disabled' : ''}>${ICONS.plus}</button>
      </div>
    </div>
    <div class="cell-right">
      <p class="line-total" data-line="${it.id}">${fmt(it.price * it.qty)}</p>
      <button type="button" class="remove-btn" data-action="remove" data-id="${it.id}" aria-label="${it.name} 삭제">${ICONS.trash}<span>삭제</span></button>
    </div>
  </li>`;
}

function renderList() {
  const has = state.items.length > 0;
  $('#listWrap').hidden    = !has;
  $('#emptyState').hidden  = has;
  $('#mobileBar').hidden   = !has;
  $('#cartList').innerHTML = state.items.map(itemHTML).join('');
  $('#headCount').textContent = state.items.length;

  const checked = state.items.filter(i => i.checked).length;
  const ca = $('#checkAll');
  ca.checked = state.items.length > 0 && checked === state.items.length;
  ca.indeterminate = checked > 0 && checked < state.items.length;
  $('#selCount').textContent = `(${checked}/${state.items.length})`;
}

function renderSummary() {
  const sel = state.items.filter(i => i.checked);
  const subtotal = sel.reduce((s, i) => s + i.price * i.qty, 0);
  const discount = COUPONS[state.coupon]?.calc?.(subtotal) ?? 0;
  const ship     = sel.length === 0 ? 0 : (subtotal >= FREE_SHIPPING_MIN ? 0 : SHIPPING_FEE);
  const total    = subtotal - discount + ship;
  const points   = Math.floor((subtotal - discount) * 0.01);

  $('#sumSubtotal').textContent = fmt(subtotal);
  $('#sumDiscount').textContent = discount > 0 ? `-${fmtNum(discount)}원` : '0원';
  $('#sumShip').innerHTML = (sel.length > 0 && ship === 0)
    ? `<s>${fmt(SHIPPING_FEE)}</s><b class="free">무료</b>`
    : fmt(ship);
  $('#sumTotal').textContent   = fmt(total);
  $('#mbTotal').textContent    = fmt(total);
  $('#checkoutCount').textContent = sel.length;
  $('#sumPoints').textContent  = points > 0 ? `${fmtNum(points)}P 적립 예상` : '';

  // 무료배송 진행바
  const pct = Math.min(100, (subtotal / FREE_SHIPPING_MIN) * 100);
  $('#shipFill').style.width = `${pct}%`;
  $('#shipProgress').setAttribute('aria-valuenow', String(Math.round(pct)));
  const label = $('#shipLabel');
  if (subtotal >= FREE_SHIPPING_MIN) {
    label.textContent = `🎉 ${fmt(FREE_SHIPPING_MIN)}원 이상 — 무료배송!`;
    label.classList.add('done');
  } else if (subtotal > 0) {
    label.textContent = `${fmt(FREE_SHIPPING_MIN - subtotal)}원 더 담으면 무료배송`;
    label.classList.remove('done');
  } else {
    label.textContent = `${fmt(FREE_SHIPPING_MIN)}원 이상 주문 시 무료배송`;
    label.classList.remove('done');
  }
}

function renderAll() { renderList(); renderSummary(); }

/* ── 토스트 ──────────────────────────────── */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── 이벤트 ──────────────────────────────── */
$('#cartList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const item = state.items.find(i => i.id === btn.dataset.id);
  if (!item) return;

  switch (btn.dataset.action) {
    case 'inc': item.qty = Math.min(QTY_MAX, item.qty + 1); break;
    case 'dec': item.qty = Math.max(QTY_MIN, item.qty - 1); break;
    case 'remove':
      state.items = state.items.filter(i => i.id !== item.id);
      toast(`‘${item.name}’ 상품을 삭제했습니다`);
      break;
  }
  save();
  renderAll();
});

$('#cartList').addEventListener('change', e => {
  const t = e.target;
  const item = state.items.find(i => i.id === t.dataset?.id);
  if (!item) return;

  if (t.classList.contains('item-check')) {
    item.checked = t.checked;
  } else if (t.classList.contains('qty-input')) {
    let v = parseInt(t.value, 10);
    if (Number.isNaN(v)) v = QTY_MIN;
    item.qty = Math.min(QTY_MAX, Math.max(QTY_MIN, v));
  }
  save();
  renderAll();
});

$('#checkAll').addEventListener('change', e => {
  state.items.forEach(i => { i.checked = e.target.checked; });
  save();
  renderAll();
});

$('#deleteSelected').addEventListener('click', () => {
  const n = state.items.filter(i => i.checked).length;
  if (!n) { toast('선택된 상품이 없습니다'); return; }
  state.items = state.items.filter(i => !i.checked);
  toast(`선택한 ${n}개 상품을 삭제했습니다`);
  save();
  renderAll();
});

$('#couponSelect').addEventListener('change', e => {
  state.coupon = e.target.value;
  save();
  renderAll();
  if (state.coupon !== 'none') toast('쿠폰이 적용되었습니다');
});

const checkout = () => {
  const n = state.items.filter(i => i.checked).length;
  if (!n) { toast('주문할 상품을 선택해 주세요'); return; }
  toast(`${n}개 상품 주문을 진행합니다 (데모 페이지)`);
};
$('#checkoutBtn').addEventListener('click', checkout);
$('#mobileCheckout').addEventListener('click', checkout);

const reset = () => {
  state = JSON.parse(JSON.stringify({ items: DEMO_ITEMS, coupon: 'none' }));
  $('#couponSelect').value = 'none';
  save();
  renderAll();
  toast('샘플 상품으로 초기화했습니다');
};
$('#resetBtn').addEventListener('click', reset);
$('#emptyReset').addEventListener('click', reset);

/* ── 초기화 ──────────────────────────────── */
$('#couponSelect').value = state.coupon;
renderAll();
</script>
