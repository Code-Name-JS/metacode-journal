<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 반드시 UTF-8 인코딩 선언 -->
  <meta charset="UTF-8">
  <!-- 모바일 등 다양한 화면 크기 대응 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
</head>
<body>
  <main class="login-card">
    <h1>로그인</h1>
    <p class="subtitle">계정에 로그인해 주세요</p>

    <!--
      ※ 이 페이지는 클라이언트 측 기초 예제입니다.
      실제 인증 처리는 서버(HTTPS, 비밀번호 해싱 등)에서 이루어져야 하며,
      이 파일에는 어떠한 계정 정보도 저장·하드코딩되어 있지 않습니다.
    -->
    <form id="loginForm">
      <!-- 아이디(이메일) -->
      <div class="form-group">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required>
        <p class="error-msg" id="emailError">올바른 이메일 형식을 입력해 주세요.</p>
      </div>

      <!-- 비밀번호 -->
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
          minlength="8"
          required>
        <p class="error-msg" id="passwordError">비밀번호는 8자 이상이어야 합니다.</p>
      </div>

      <!-- 아이디 저장 / 비밀번호 찾기 -->
      <div class="options-row">
        <label>
          <input type="checkbox" id="remember" name="remember">
          로그인 상태 유지
        </label>
        <a href="#">비밀번호 찾기</a>
      </div>

      <button type="submit" class="btn-login">로그인</button>

      <p class="signup-text">
        아직 계정이 없으신가요? <a href="#">회원가입</a>
      </p>
    </form>
  </main>
</body>
</html>
