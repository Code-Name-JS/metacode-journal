<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인·Genspark</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="card" aria-labelledby="loginTitle">
        <div class="brand">
            <div class="logo" aria-hidden="true">G</div>
            <span style="font-weight: 700; font-size: 18px;">Genspark</span>
        </div>
        <h1 id="loginTitle">다시 만나 반가워요</h1>
        <p class="sub">계정에 로그인하여 계속하세요</p>

        <form id="loginForm" novalidate>
            <div class="field" id="emailField">
                <label for="email">이메일</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" placeholder="you@example.com"
                    autocomplete="email" aria-describedby="emailError">
                </div>
                <p class="error-msg" id="emailError" role="alert"></p>
            </div>

            <div class="field" id="passwordField">
                <label for="password">비밀번호</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력"
                    autocomplete="current-password" aria-describedby="passwordError">
                    <button type="button" class="toggle" id="togglePw" aria-label="비밀번호 표시/숨기기" aria-pressed="false">👁️</button>
                </div>
                <p class="error-msg" id="passwordError" role="alert"></p>
            </div>

            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="remember" name="remember">로그인 상태 유지
                </label>
                <a href="#" class="forgot">비밀번호 찾기</a>
            </div>

            <button type="submit" class="btn-primary">로그인</button>
        </form>

        <div class="divider">또는</div>

        <div class="socials">
            <button type="button" class="btn-social" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.2H12v4.1h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.2-2 3.7-5 3.7-8.6z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.2-4.2 1.2-3.2 0-5.9-2.1-6.9-5.1l-3.8 3C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.1 14.3c-.3-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3L1.3 6.7C.5 8.3 0 10.1 0 12s.5 3.7 1.3 5.3l3.8-3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.7l3.8 3c1-3 3.7-5 6.9-5z"/></svg>
                Google
            </button>
            <button type="button" class="btn-social" id="appleBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c-.03-2.9 2.37-4.3 2.48-4.37-1.35-1.98-3.45-2.25-4.2-2.28-1.79-.18-3.5 1.05-4.4 1.05-.9 0-2.3-1.02-3.78-1-1.94.03-3.73 1.13-4.73 2.87-2.02 3.5-.52 8.68 1.45 11.52.96 1.39 2.1 2.95 3.6 2.9 1.44-.06 1.99-.93 3.74-.93 1.74 0 2.23.93 3.76.9 1.56-.03 2.54-1.42 3.49-2.82 1.1-1.61 1.55-3.17 1.58-3.25-.03-.01-3.02-1.16-3.05-4.59zM14.28 3.7c.8-.97 1.34-2.32 1.19-3.66-1.15.05-2.55.77-3.38 1.74-.74.86-1.39 2.24-1.22 3.56 1.29.1 2.61-.66 3.41-1.64z"/></svg>
                Apple
            </button>
        </div>

        <p class="signup">계정이 없으신가요?<a href="#">회원가입</a></p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./main.js" defer></script>
</body>
</html>
